name: Deploy Wnode Sovereign Compute

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      TINY_MODEL_ENDPOINT: ${{ secrets.TINY_MODEL_ENDPOINT || 'https://api.wnode.one/api/v1/ai/orchestrator' }}
      NODLD_API_URL: ${{ secrets.NODLD_API_URL || 'http://127.0.0.1:8081' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies & Build
      run: |
        npm install -g pnpm
        pnpm install
        pnpm --filter command build
        pnpm --filter nodlr build
        pnpm --filter mesh build
