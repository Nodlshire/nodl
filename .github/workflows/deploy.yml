name: Deploy Wnode Sovereign Compute

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Remote Pull and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          # Source profile for node/pnpm/pm2 environments
          source ~/.bashrc || true
          
          cd /home/obregan/Documents/nodl
          
          # Pull the latest code directly from GitHub instead of using slow SCP
          git pull origin main
          
          # Install dependencies and rebuild portals
          pnpm install
          pnpm --filter command build
          pnpm --filter nodlr build
          pnpm --filter mesh build
          
          # Restart background processes
          pm2 restart all
          pm2 save
