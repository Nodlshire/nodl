<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-trap { animation: none !important; }
    }
    
    .anim-trap {
      animation: trapPulse 4s ease-in-out infinite;
    }

    @keyframes trapPulse {
      0%, 40% { stroke: #00FFB2; fill: rgba(0, 255, 178, 0.05); }
      50%, 80% { stroke: #FF4444; fill: rgba(255, 68, 68, 0.2); }
      100% { stroke: #00FFB2; fill: rgba(0, 255, 178, 0.05); }
    }
  </style>

  <!-- Title Banner -->
  <text x="20" y="30" fill="#00FFB2" font-size="13" font-weight="700">ANIM 4.1 – CAPABILITY TRAP &amp; MEMORY ISOLATION ENFORCEMENT</text>
  <text x="600" y="30" fill="#22D3EE" font-size="11" font-weight="500">Zero-Trust Sandbox</text>

  <!-- Sandbox Boundary Box -->
  <rect x="100" y="60" width="600" height="120" rx="10" stroke-width="2" className="anim-trap"/>

  <!-- Inside Guest Process -->
  <rect x="140" y="85" width="200" height="70" rx="6" fill="#141419" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="240" y="115" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Guest MicroVM Process</text>
  <text x="240" y="135" fill="#00FFB2" font-size="10" text-anchor="middle">SECCOMP-BPF Filter Active</text>

  <!-- Attack Attempt Arrow -->
  <line x1="340" y1="120" x2="480" y2="120" stroke="#FF4444" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="410" y="112" fill="#FF4444" font-size="11" font-weight="700" text-anchor="middle">Syscall: `ptrace` / `/dev/mem`</text>

  <!-- Trap Defense Barrier -->
  <rect x="480" y="85" width="180" height="70" rx="6" fill="#141419" stroke="#FF4444" stroke-width="1.5"/>
  <text x="570" y="110" fill="#FF4444" font-size="12" font-weight="800" text-anchor="middle">SYSCALL TRAPPED</text>
  <text x="570" y="130" fill="#FFFFFF" font-size="10" text-anchor="middle">SIGSYS / MicroVM Terminated</text>

  <text x="400" y="210" fill="#A0A0AB" font-size="11" text-anchor="middle">Zero host filesystem access or unauthorized syscall capability allowed. Instant container kill.</text>
</svg>
