<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-pulse, .anim-flow, .anim-wipe { animation: none !important; }
    }
    
    .anim-flow {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: flowPath 6s linear infinite;
    }
    
    .anim-pulse {
      animation: pulseGlow 2s ease-in-out infinite alternate;
    }

    .anim-wipe {
      animation: wipeEffect 6s ease-in-out infinite;
    }

    @keyframes flowPath {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      30% { stroke-dashoffset: 0; opacity: 1; }
      80% { stroke-dashoffset: -200; opacity: 1; }
      100% { stroke-dashoffset: -200; opacity: 0; }
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 2px #00FFB2); }
      100% { filter: drop-shadow(0 0 10px #00FFB2); }
    }

    @keyframes wipeEffect {
      0%, 65% { opacity: 0; transform: scaleX(0); }
      70% { opacity: 1; transform: scaleX(1); }
      80%, 100% { opacity: 0; transform: scaleX(1); }
    }
  </style>

  <!-- Title Banner -->
  <text x="20" y="30" fill="#00FFB2" font-size="13" font-weight="700">ANIM 1.1 – JOB EXECUTION LIFECYCLE (8-SECOND TEMPORAL SEQUENCE)</text>
  <text x="620" y="30" fill="#22D3EE" font-size="11" font-weight="500">RAM-Only Execution</text>

  <!-- Nodes -->
  <!-- Step 1: Client Ingress -->
  <rect x="40" y="60" width="140" height="80" rx="8" fill="#141419" stroke="#00FFB2" stroke-width="1.5" className="anim-pulse"/>
  <text x="110" y="95" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1. Client HMAC</text>
  <text x="110" y="115" fill="#00FFB2" font-size="10" text-anchor="middle">Ed25519 Signed</text>

  <!-- Connector 1-2 -->
  <line x1="180" y1="100" x2="260" y2="100" stroke="#00FFB2" stroke-width="2" className="anim-flow"/>

  <!-- Step 2: SOT Core -->
  <rect x="260" y="60" width="140" height="80" rx="8" fill="#141419" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="330" y="95" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2. SOT Route</text>
  <text x="330" y="115" fill="#22D3EE" font-size="10" text-anchor="middle">Nonce Validated</text>

  <!-- Connector 2-3 -->
  <line x1="400" y1="100" x2="480" y2="100" stroke="#22D3EE" stroke-width="2" className="anim-flow"/>

  <!-- Step 3: Sandbox Exec -->
  <rect x="480" y="60" width="140" height="80" rx="8" fill="#141419" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="550" y="95" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">3. MicroVM Exec</text>
  <text x="550" y="115" fill="#00FFB2" font-size="10" text-anchor="middle">`tmpfs mlock`</text>

  <!-- Connector 3-4 -->
  <line x1="620" y1="100" x2="700" y2="100" stroke="#00FFB2" stroke-width="2" className="anim-flow"/>

  <!-- Step 4: Memory Wipe & Return -->
  <rect x="700" y="60" width="80" height="80" rx="8" fill="#141419" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="740" y="95" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">4. Wipe</text>
  <text x="740" y="115" fill="#A0A0AB" font-size="9" text-anchor="middle">`bzero`</text>

  <!-- Memory Wipe Overlay Animation -->
  <rect x="480" y="150" width="300" height="30" rx="4" fill="rgba(0, 255, 178, 0.15)" stroke="#00FFB2" stroke-width="1" className="anim-wipe"/>
  <text x="630" y="170" fill="#00FFB2" font-size="11" font-weight="700" text-anchor="middle">explicit_bzero Memory Wipe Active</text>

  <text x="400" y="215" fill="#A0A0AB" font-size="11" text-anchor="middle">Automatic 8-second temporal lifecycle loop. Respects prefers-reduced-motion settings.</text>
</svg>
