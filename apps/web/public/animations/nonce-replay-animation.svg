<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim-attack, .anim-reject { animation: none !important; }
    }
    
    .anim-attack {
      animation: attackMove 5s ease-in-out infinite;
    }
    
    .anim-reject {
      animation: rejectFlash 5s ease-in-out infinite;
    }

    @keyframes attackMove {
      0% { transform: translateX(0); opacity: 0; }
      20% { transform: translateX(0); opacity: 1; }
      50% { transform: translateX(260px); opacity: 1; }
      60% { transform: translateX(260px); opacity: 1; }
      80%, 100% { transform: translateX(0); opacity: 0; }
    }

    @keyframes rejectFlash {
      0%, 45% { opacity: 0; fill: #141419; stroke: rgba(255,255,255,0.1); }
      50%, 80% { opacity: 1; fill: rgba(255, 68, 68, 0.2); stroke: #FF4444; }
      100% { opacity: 0; fill: #141419; stroke: rgba(255,255,255,0.1); }
    }
  </style>

  <!-- Title Banner -->
  <text x="20" y="30" fill="#FF4444" font-size="13" font-weight="700">ANIM 2.2 – NONCE REPLAY ATTACK REJECTION (10-SECOND SEQUENCE)</text>
  <text x="600" y="30" fill="#22D3EE" font-size="11" font-weight="500">Security Envelope</text>

  <!-- Attacker Node -->
  <rect x="40" y="70" width="160" height="70" rx="8" fill="#141419" stroke="#FF4444" stroke-width="1.5"/>
  <text x="120" y="100" fill="#FF4444" font-size="12" font-weight="700" text-anchor="middle">Replayed Packet</text>
  <text x="120" y="120" fill="#FFFFFF" font-size="10" text-anchor="middle">Nonce N_1092</text>

  <!-- Moving Replay Packet -->
  <circle cx="120" cy="105" r="8" fill="#FF4444" className="anim-attack"/>

  <!-- SOT Bloom Filter Cache -->
  <rect x="360" y="70" width="180" height="70" rx="8" fill="#141419" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="450" y="100" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">SOT Nonce Cache</text>
  <text x="450" y="120" fill="#00FFB2" font-size="10" text-anchor="middle">N_1092 Registered (HIT)</text>

  <!-- Rejection Wall -->
  <rect x="600" y="60" width="160" height="90" rx="8" className="anim-reject"/>
  <text x="680" y="100" fill="#FF4444" font-size="13" font-weight="800" text-anchor="middle">REJECTED 409</text>
  <text x="680" y="120" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">ERR_NONCE_REPLAYED</text>

  <text x="400" y="200" fill="#A0A0AB" font-size="11" text-anchor="middle">Automatic 10-second temporal sequence showing instant SOT cache rejection.</text>
</svg>
