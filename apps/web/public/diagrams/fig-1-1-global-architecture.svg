<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0E0E10; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FFB2" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Figure Header -->
  <text x="30" y="40" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="1">FIG. 1.1 — WNODE GLOBAL SYSTEM ARCHITECTURE</text>
  <text x="30" y="60" fill="#94A3B8" font-size="12">Canonical multi-layer topology: Compute Buyer, AI Orchestrator, SOT Telemetry Mesh &amp; Settlement</text>

  <!-- Layer 1: Compute Buyer & Agent Layer -->
  <rect x="30" y="90" width="940" height="90" rx="12" fill="#141417" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="50" y="115" fill="#00FFB2" font-size="12" font-weight="700" letter-spacing="0.5">1. COMPUTE BUYER &amp; AGENT LAYER</text>
  <rect x="50" y="130" width="260" height="36" rx="6" fill="#0E0E10" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="180" y="153" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">API Client / Python SDK</text>
  <rect x="340" y="130" width="260" height="36" rx="6" fill="#0E0E10" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="470" y="153" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Autonomous AI Agent</text>
  <rect x="630" y="130" width="320" height="36" rx="6" fill="#0E0E10" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="790" y="153" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">HMAC Payload Signer (SHA-256)</text>

  <!-- Connection Arrows -->
  <path d="M 500 180 L 500 210" stroke="#00FFB2" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Layer 2: Sovereign AI Orchestrator Layer -->
  <rect x="30" y="210" width="940" height="110" rx="12" fill="#141417" stroke="rgba(0,255,178,0.3)" stroke-width="1.5"/>
  <text x="50" y="235" fill="#00FFB2" font-size="12" font-weight="700" letter-spacing="0.5">2. SOVEREIGN AI ORCHESTRATOR &amp; SOT ROUTER (PORT 8080)</text>
  <rect x="50" y="250" width="260" height="50" rx="8" fill="url(#emeraldGrad)" stroke="#00FFB2" stroke-opacity="0.6"/>
  <text x="180" y="272" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">SOT Go Service (8080)</text>
  <text x="180" y="288" fill="#00FFB2" font-size="10" font-mono font-weight="500" text-anchor="middle">Sub-10ms Epoch Router</text>
  
  <rect x="340" y="250" width="260" height="50" rx="8" fill="url(#emeraldGrad)" stroke="#00FFB2" stroke-opacity="0.6"/>
  <text x="470" y="272" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Affiliate VGE Engine</text>
  <text x="470" y="288" fill="#00FFB2" font-size="10" font-mono text-anchor="middle">L1 (3%) / L2 (7%) Override</text>

  <rect x="630" y="250" width="320" height="50" rx="8" fill="url(#emeraldGrad)" stroke="#00FFB2" stroke-opacity="0.6"/>
  <text x="790" y="272" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">WireGuard mTLS Mesh Gateway</text>
  <text x="790" y="288" fill="#00FFB2" font-size="10" font-mono text-anchor="middle">AES-256-GCM Tunnels</text>

  <!-- Connection Arrows -->
  <path d="M 280 320 L 280 350" stroke="#00FFB2" stroke-width="2"/>
  <path d="M 720 320 L 720 350" stroke="#22D3EE" stroke-width="2"/>

  <!-- Layer 3: Execution Mesh Tiers -->
  <rect x="30" y="350" width="940" height="130" rx="12" fill="#141417" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="50" y="375" fill="#00FFB2" font-size="12" font-weight="700" letter-spacing="0.5">3. EXECUTION MESH &amp; NODE DAEMON (nodld)</text>
  
  <!-- Earth Mesh -->
  <rect x="50" y="390" width="430" height="70" rx="8" fill="#0E0E10" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="65" y="412" fill="#00FFB2" font-size="11" font-weight="700">Earth Mesh (Tier-1 Synchronous)</text>
  <text x="65" y="430" fill="#94A3B8" font-size="10">H100/RTX4090 GPUs • Firecracker microVM • gVisor Sandbox</text>
  <text x="65" y="445" fill="#FFFFFF" font-size="10" font-mono>mLock RAM-Only • SECCOMP Enforced</text>

  <!-- Space / DeWi Mesh -->
  <rect x="520" y="390" width="430" height="70" rx="8" fill="#0E0E10" stroke="#22D3EE" stroke-opacity="0.4"/>
  <text x="535" y="412" fill="#22D3EE" font-size="11" font-weight="700">Space &amp; DeWi Mesh (Tier-3/5 Asynchronous)</text>
  <text x="535" y="430" fill="#94A3B8" font-size="10">LEO Satellites • CBRS 3.5GHz • LoRaWAN Gateway Telemetry</text>
  <text x="535" y="445" fill="#FFFFFF" font-size="10" font-mono font-weight="500">Store-and-Forward WAL • Hardware Proof L_mem</text>

  <!-- Layer 4: Settlement & Governance -->
  <rect x="30" y="495" width="940" height="75" rx="12" fill="#141417" stroke="rgba(147,51,234,0.4)" stroke-width="1"/>
  <text x="50" y="520" fill="#9333EA" font-size="12" font-weight="700" letter-spacing="0.5">4. SETTLEMENT &amp; GOVERNANCE LAYER</text>
  <text x="50" y="542" fill="#FFFFFF" font-size="11">Stripe Connect Automated Daily Fiat Settlement • 10-Min Audit Synchronization • Soul-DAO Governance</text>
  <text x="50" y="557" fill="#94A3B8" font-size="10" font-mono>Append-Only SOT Execution Log (/api/v1/earnings) • Immutable Parent-Child Tree Placement</text>
</svg>
