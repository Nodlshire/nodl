<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0E0E10; font-family:'Inter', sans-serif;">
  <!-- Header -->
  <text x="30" y="40" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="1">FIG. 1.2 — JOB EXECUTION SEQUENCE DIAGRAM</text>
  <text x="30" y="60" fill="#94A3B8" font-size="12">5-step deterministic job dispatch, SECCOMP sandboxing, and signed telemetry return</text>

  <!-- Lifelines Header -->
  <rect x="50" y="90" width="160" height="36" rx="6" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="130" y="113" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">1. Client / SDK</text>

  <rect x="290" y="90" width="160" height="36" rx="6" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="370" y="113" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">2. SOT Router (8080)</text>

  <rect x="530" y="90" width="160" height="36" rx="6" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="610" y="113" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">3. Node Daemon (nodld)</text>

  <rect x="770" y="90" width="180" height="36" rx="6" fill="#141417" stroke="#22D3EE" stroke-opacity="0.4"/>
  <text x="860" y="113" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">4. SECCOMP Sandbox</text>

  <!-- Lifeline Dashed Lines -->
  <line x1="130" y1="126" x2="130" y2="440" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,4"/>
  <line x1="370" y1="126" x2="370" y2="440" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,4"/>
  <line x1="610" y1="126" x2="610" y2="440" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,4"/>
  <line x1="860" y1="126" x2="860" y2="440" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,4"/>

  <!-- Step 1: Client -> Router -->
  <path d="M 130 160 L 360 160" stroke="#00FFB2" stroke-width="2"/>
  <polygon points="360,155 370,160 360,165" fill="#00FFB2"/>
  <rect x="140" y="142" width="220" height="18" fill="#0E0E10" rx="3"/>
  <text x="250" y="155" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Step 1: HMAC Signed Request (Nonce N)</text>

  <!-- Step 2: Router -> Node -->
  <path d="M 370 210 L 600 210" stroke="#00FFB2" stroke-width="2"/>
  <polygon points="600,205 610,210 600,215" fill="#00FFB2"/>
  <rect x="380" y="192" width="220" height="18" fill="#0E0E10" rx="3"/>
  <text x="490" y="205" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Step 2: Epoch Check &amp; Dispatch</text>

  <!-- Step 3: Node -> SECCOMP Sandbox -->
  <path d="M 610 260 L 850 260" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="850,255 860,260 850,265" fill="#22D3EE"/>
  <rect x="620" y="242" width="220" height="18" fill="#0E0E10" rx="3"/>
  <text x="730" y="255" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Step 3: Spawn Native Go in mlock RAM</text>

  <!-- Step 4: SECCOMP -> Node (Result & Envelope) -->
  <path d="M 860 310 L 620 310" stroke="#00FFB2" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="620,305 610,310 620,315" fill="#00FFB2"/>
  <rect x="630" y="292" width="210" height="18" fill="#0E0E10" rx="3"/>
  <text x="735" y="305" fill="#00FFB2" font-size="10" font-weight="600" text-anchor="middle">Step 4: Wipe Memory &amp; Sign Telemetry</text>

  <!-- Step 5: Node -> Client (Encrypted Result) -->
  <path d="M 610 370 L 140 370" stroke="#00FFB2" stroke-width="2"/>
  <polygon points="140,365 130,370 140,375" fill="#00FFB2"/>
  <rect x="250" y="352" width="240" height="18" fill="#0E0E10" rx="3"/>
  <text x="370" y="365" fill="#00FFB2" font-size="10" font-weight="600" text-anchor="middle">Step 5: Encrypted Job Result &amp; SHA-256 Envelope</text>
</svg>
