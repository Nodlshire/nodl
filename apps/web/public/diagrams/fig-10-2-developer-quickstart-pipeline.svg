<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <!-- Header Banner -->
  <rect x="20" y="20" width="920" height="50" rx="8" fill="#141419" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="40" y="50" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="0.5">FIG 10.2 – DEVELOPER SDK COMPILATION &amp; JOB DISPATCH PIPELINE</text>
  <text x="730" y="50" fill="#22D3EE" font-size="12" font-weight="500">v1.5.0-enterprise | Developer API</text>

  <!-- Step 1: SDK Spec Definition -->
  <rect x="40" y="100" width="260" height="340" rx="10" fill="#141419" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="60" y="135" fill="#00FFB2" font-size="14" font-weight="700">1. SDK Client Initialization</text>

  <rect x="60" y="160" width="220" height="110" rx="6" fill="#1E1E26" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="75" y="185" fill="#22D3EE" font-size="12" font-family="monospace">wnode.NewClient(opts)</text>
  <text x="75" y="205" fill="#FFFFFF" font-size="11">ApiKey: "wnode_live_..."</text>
  <text x="75" y="225" fill="#FFFFFF" font-size="11">Signer: Ed25519 Private Key</text>
  <text x="75" y="245" fill="#A0A0AB" font-size="11">TargetTier: Tier1_GPU</text>

  <rect x="60" y="290" width="220" height="120" rx="6" fill="#1E1E26" stroke="#00FFB2" stroke-width="1"/>
  <text x="75" y="315" fill="#00FFB2" font-size="12" font-weight="600">Declarative Spec Definition</text>
  <text x="75" y="335" fill="#FFFFFF" font-size="11">• Image: `nvidia/cuda:12.2`</text>
  <text x="75" y="355" fill="#FFFFFF" font-size="11">• RAM Limit: `16GB (tmpfs)`</text>
  <text x="75" y="375" fill="#FFFFFF" font-size="11">• Timeout: `120s`</text>
  <text x="75" y="395" fill="#A0A0AB" font-size="11">• Nonce: Cryptographic UUID</text>

  <!-- Flow 1->2 -->
  <line x1="300" y1="270" x2="350" y2="270" stroke="#00FFB2" stroke-width="2"/>
  <polygon points="350,266 360,270 350,274" fill="#00FFB2"/>

  <!-- Step 2: SOT Dispatch & Validation -->
  <rect x="360" y="100" width="240" height="340" rx="10" fill="#141419" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="380" y="135" fill="#22D3EE" font-size="14" font-weight="700">2. SOT Ingress (Port 8080)</text>

  <rect x="380" y="160" width="200" height="70" rx="6" fill="#1E1E26" stroke="#00FFB2" stroke-width="1"/>
  <text x="395" y="185" fill="#FFFFFF" font-size="12" font-weight="600">HMAC-SHA256 Verification</text>
  <text x="395" y="205" fill="#A0A0AB" font-size="11">Ed25519 key signature match</text>

  <rect x="380" y="245" width="200" height="70" rx="6" fill="#1E1E26" stroke="#22D3EE" stroke-width="1"/>
  <text x="395" y="270" fill="#FFFFFF" font-size="12" font-weight="600">Nonce Replay Check</text>
  <text x="395" y="290" fill="#A0A0AB" font-size="11">Bloom filter cache lookup</text>

  <rect x="380" y="330" width="200" height="90" rx="6" fill="#1E1E26" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="395" y="355" fill="#FFFFFF" font-size="12" font-weight="600">Sub-10ms Routing</text>
  <text x="395" y="375" fill="#A0A0AB" font-size="11">Match node availability</text>
  <text x="395" y="395" fill="#00FFB2" font-size="11">Dispatch WireGuard frame</text>

  <!-- Flow 2->3 -->
  <line x1="600" y1="270" x2="650" y2="270" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="650,266 660,270 650,274" fill="#22D3EE"/>

  <!-- Step 3: Execution & Signed Return -->
  <rect x="660" y="100" width="260" height="340" rx="10" fill="#141419" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="680" y="135" fill="#00FFB2" font-size="14" font-weight="700">3. MicroVM Execution</text>

  <rect x="680" y="160" width="220" height="80" rx="6" fill="#1E1E26" stroke="#00FFB2" stroke-width="1"/>
  <text x="695" y="185" fill="#FFFFFF" font-size="12" font-weight="600">RAM-Only Execution</text>
  <text x="695" y="205" fill="#A0A0AB" font-size="11">`tmpfs mlock` sandbox mount</text>
  <text x="695" y="225" fill="#00FFB2" font-size="11">SECCOMP-BPF syscall block</text>

  <rect x="680" y="255" width="220" height="80" rx="6" fill="#1E1E26" stroke="#22D3EE" stroke-width="1"/>
  <text x="695" y="280" fill="#FFFFFF" font-size="12" font-weight="600">Memory Wipe (`explicit_bzero`)</text>
  <text x="695" y="300" fill="#A0A0AB" font-size="11">Zero persistence guarantee</text>

  <rect x="680" y="345" width="220" height="75" rx="6" fill="#1E1E26" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="695" y="370" fill="#FFFFFF" font-size="12" font-weight="600">Signed Result Payload</text>
  <text x="695" y="390" fill="#A0A0AB" font-size="11">Return cryptographically signed output</text>
</svg>
