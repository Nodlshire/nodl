<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background:#0E0E10; font-family:'Inter', sans-serif;">
  <text x="30" y="40" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="1">FIG. 5.1 — TELEMETRY INGESTION PIPELINE</text>
  <text x="30" y="60" fill="#94A3B8" font-size="12">Node heartbeat verification, hardware proof validation, rate limiting, and SOT ledger sync</text>

  <!-- Flow Boxes -->
  <g transform="translate(30, 100)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="200" height="180" rx="10" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#00FFB2" font-size="12" font-weight="700">1. Signed Heartbeat</text>
    <text x="20" y="55" fill="#FFFFFF" font-size="10">Node Envelope</text>
    <text x="20" y="75" fill="#94A3B8" font-size="9">Ed25519 Signed Payload</text>
    <text x="20" y="90" fill="#94A3B8" font-size="9">Monotonic Nonce N</text>
    <text x="20" y="105" fill="#94A3B8" font-size="9">Telemetry Metrics</text>

    <!-- Arrow 1 -->
    <path d="M 200 90 L 240 90" stroke="#00FFB2" stroke-width="2"/>
    <polygon points="240,85 250,90 240,95" fill="#00FFB2"/>

    <!-- Stage 2 -->
    <rect x="250" y="0" width="200" height="180" rx="10" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
    <text x="270" y="30" fill="#00FFB2" font-size="12" font-weight="700">2. Rate Limiter</text>
    <text x="270" y="55" fill="#FFFFFF" font-size="10">Token Bucket Filter</text>
    <text x="270" y="75" fill="#94A3B8" font-size="9">1,000 req/min WUID limit</text>
    <text x="270" y="105" fill="#EF4444" font-size="9" font-weight="700">Back-Pressure Branch:</text>
    <text x="270" y="120" fill="#EF4444" font-size="9">HTTP 429 Too Many Req</text>
    <text x="270" y="135" fill="#EF4444" font-size="9">Retry-After Header</text>

    <!-- Arrow 2 -->
    <path d="M 450 90 L 490 90" stroke="#00FFB2" stroke-width="2"/>
    <polygon points="490,85 500,90 490,95" fill="#00FFB2"/>

    <!-- Stage 3 -->
    <rect x="500" y="0" width="200" height="180" rx="10" fill="#141417" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="520" y="30" fill="#22D3EE" font-size="12" font-weight="700">3. Hardware Challenge</text>
    <text x="520" y="55" fill="#FFFFFF" font-size="10">Memory Latency Proof</text>
    <text x="520" y="75" fill="#94A3B8" font-size="9">L_mem Proof Verification</text>
    <text x="520" y="90" fill="#94A3B8" font-size="9">GPU Enclave Signature</text>
    <text x="520" y="105" fill="#94A3B8" font-size="9">Uptime Telemetry</text>

    <!-- Arrow 3 -->
    <path d="M 700 90 L 740 90" stroke="#00FFB2" stroke-width="2"/>
    <polygon points="740,85 750,90 740,95" fill="#00FFB2"/>

    <!-- Stage 4 -->
    <rect x="750" y="0" width="190" height="180" rx="10" fill="rgba(0,255,178,0.08)" stroke="#00FFB2"/>
    <text x="765" y="30" fill="#00FFB2" font-size="12" font-weight="700">4. SOT Ledger Sync</text>
    <text x="765" y="55" fill="#FFFFFF" font-size="10">Atomic DB Write</text>
    <text x="765" y="75" fill="#94A3B8" font-size="9">Go Backend (Port 8080)</text>
    <text x="765" y="90" fill="#94A3B8" font-size="9">BBolt / SQLite Sync</text>
    <text x="765" y="115" fill="#00FFB2" font-size="9" font-mono font-weight="700">Instant CMD Sync</text>
  </g>
</svg>
