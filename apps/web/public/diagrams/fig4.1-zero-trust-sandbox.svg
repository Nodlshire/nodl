<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" style="background:#0E0E10; font-family:'Inter', sans-serif;">
  <text x="30" y="40" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="1">FIG. 4.1 — ZERO-TRUST SANDBOX BOUNDARIES</text>
  <text x="30" y="60" fill="#94A3B8" font-size="12">Dual-contrast view: Allowed guest capability scope vs blocked host system calls</text>

  <!-- Left: Allowed Guest Capabilities -->
  <rect x="30" y="90" width="450" height="260" rx="12" fill="#141417" stroke="#00FFB2" stroke-opacity="0.4"/>
  <text x="50" y="115" fill="#00FFB2" font-size="12" font-weight="700">ALLOWED GUEST CAPABILITIES (EXPLICIT SCOPE)</text>
  
  <g transform="translate(50, 130)" font-size="11" fill="#FFFFFF">
    <rect x="0" y="0" width="410" height="32" rx="6" fill="rgba(0,255,178,0.08)" stroke="#00FFB2" stroke-opacity="0.3"/>
    <text x="15" y="20">✓ Read-only Input Buffer Payload (In-Memory)</text>

    <rect x="0" y="42" width="410" height="32" rx="6" fill="rgba(0,255,178,0.08)" stroke="#00FFB2" stroke-opacity="0.3"/>
    <text x="15" y="62">✓ Pure Deterministic Math / AI Inference Execution</text>

    <rect x="0" y="84" width="410" height="32" rx="6" fill="rgba(0,255,178,0.08)" stroke="#00FFB2" stroke-opacity="0.3"/>
    <text x="15" y="104">✓ Output SHA-256 Digest Generation</text>

    <rect x="0" y="126" width="410" height="32" rx="6" fill="rgba(0,255,178,0.08)" stroke="#00FFB2" stroke-opacity="0.3"/>
    <text x="15" y="146">✓ Hardware Acceleration (GPU PCIe Pass-through via Driver Enclave)</text>
  </g>

  <!-- Right: Blocked Syscalls & Host Features -->
  <rect x="520" y="90" width="450" height="260" rx="12" fill="#141417" stroke="#EF4444" stroke-opacity="0.4"/>
  <text x="540" y="115" fill="#EF4444" font-size="12" font-weight="700">BLOCKED SYSCALLS &amp; TRAPPED OPERATIONS</text>
  
  <g transform="translate(540, 130)" font-size="11" fill="#FFFFFF">
    <rect x="0" y="0" width="410" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="15" y="20" fill="#F87171">✗ Raw Host Network Sockets (socket, bind, connect)</text>

    <rect x="0" y="42" width="410" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="15" y="62" fill="#F87171">✗ Disk File Access (open, read, write, unlink)</text>

    <rect x="0" y="84" width="410" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="15" y="104" fill="#F87171">✗ Process Spawning (fork, execve, clone)</text>

    <rect x="0" y="126" width="410" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-opacity="0.3"/>
    <text x="15" y="146" fill="#F87171">✗ Memory Un-Capped Allocation (brk / mmap expansion)</text>
  </g>
</svg>
