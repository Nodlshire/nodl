    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">4. Verified</text>
    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">VERIFIED_BY_TELEMETRY</text>
