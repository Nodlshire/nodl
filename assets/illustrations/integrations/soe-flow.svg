    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Autonomous Rules</text>
  </g>

  <path d="M 390 100 L 430 100" stroke="#8b5cf6" stroke-width="3"/>

