<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#090d16" rx="16"/>
  
  <!-- Steps -->
  <!-- Step 1: Install -->
  <g transform="translate(40, 60)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Install</text>
    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">curl -fsSL ...</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 190 100 L 230 100" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Configure -->
  <g transform="translate(240, 60)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Configure</text>
    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">nodld.toml / env</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 390 100 L 430 100" stroke="#8b5cf6" stroke-width="3"/>

  <!-- Step 3: Verify -->
  <g transform="translate(440, 60)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Verify</text>
    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">./nodld --status</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 590 100 L 630 100" stroke="#10b981" stroke-width="3"/>

  <!-- Step 4: Optimize -->
  <g transform="translate(640, 60)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4. Optimize</text>
    <text x="70" y="65" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">RAM &amp; DeWi tuning</text>
  </g>
</svg>
