<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="emGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="20" y="20" width="920" height="50" rx="8" fill="#141419" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="40" y="50" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="0.5">FIG 2.2 – NONCE REPLAY PROTECTION & CACHE EVICTION SEQUENCE</text>
  <text x="730" y="50" fill="#22D3EE" font-size="12" font-weight="500">v1.5.0-enterprise | Security Envelope</text>

  <!-- Lifelines -->
  <!-- Client Lifeline -->
  <line x1="140" y1="110" x2="140" y2="470" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="80" y="80" width="120" height="36" rx="6" fill="#1A1A22" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="140" y="103" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Client SDK</text>

  <!-- Gateway Lifeline -->
  <line x1="380" y1="110" x2="380" y2="470" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="310" y="80" width="140" height="36" rx="6" fill="#1A1A22" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="380" y="103" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">SOT Ingress (8080)</text>

  <!-- Nonce Cache Lifeline -->
  <line x1="620" y1="110" x2="620" y2="470" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="540" y="80" width="160" height="36" rx="6" fill="#1A1A22" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="620" y="103" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">SOT Nonce Bloom Cache</text>

  <!-- Execution Sandbox Lifeline -->
  <line x1="840" y1="110" x2="840" y2="470" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="770" y="80" width="140" height="36" rx="6" fill="#1A1A22" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="840" y="103" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">MicroVM Sandbox</text>

  <!-- Sequence Step 1: Initial Dispatch -->
  <line x1="140" y1="150" x2="370" y2="150" stroke="#00FFB2" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="370,146 380,150 370,154" fill="#00FFB2"/>
  <text x="255" y="142" fill="#00FFB2" font-size="11" font-weight="500" text-anchor="middle">1. POST /api/v1/job (HMAC + Nonce N_1092)</text>

  <!-- Sequence Step 2: Nonce Lookup -->
  <line x1="380" y1="190" x2="610" y2="190" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="610,186 620,190 610,194" fill="#22D3EE"/>
  <text x="500" y="182" fill="#22D3EE" font-size="11" font-weight="500" text-anchor="middle">2. Check &amp; Store Nonce(N_1092)</text>

  <!-- Response 2b: Cache MISS -> OK -->
  <line x1="620" y1="220" x2="390" y2="220" stroke="#00FFB2" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="390,216 380,220 390,224" fill="#00FFB2"/>
  <text x="500" y="214" fill="#00FFB2" font-size="11" font-weight="500" text-anchor="middle">Cache MISS -> Registered (TTL=300s)</text>

  <!-- Sequence Step 3: Forward to Sandbox -->
  <line x1="380" y1="260" x2="830" y2="260" stroke="#00FFB2" stroke-width="2"/>
  <polygon points="830,256 840,260 830,264" fill="#00FFB2"/>
  <text x="610" y="252" fill="#FFFFFF" font-size="11" font-weight="500" text-anchor="middle">3. Spawn microVM Execution Context</text>

  <!-- ATTACK SCENARIO: Replay Attempt -->
  <rect x="40" y="300" width="880" height="150" rx="8" fill="rgba(255, 68, 68, 0.05)" stroke="rgba(255, 68, 68, 0.3)" stroke-width="1"/>
  <text x="60" y="322" fill="#FF4444" font-size="12" font-weight="700">REPLAY ATTACK SCENARIO (M-in-the-Middle Re-transmits Nonce N_1092)</text>

  <!-- Replay Dispatch -->
  <line x1="140" y1="350" x2="370" y2="350" stroke="#FF4444" stroke-width="2"/>
  <polygon points="370,346 380,350 370,354" fill="#FF4444"/>
  <text x="255" y="342" fill="#FF4444" font-size="11" font-weight="600" text-anchor="middle">4. Replayed POST /api/v1/job (N_1092)</text>

  <!-- Cache Lookup -->
  <line x1="380" y1="380" x2="610" y2="380" stroke="#FF4444" stroke-width="2"/>
  <polygon points="610,376 620,380 610,384" fill="#FF4444"/>
  <text x="500" y="374" fill="#FF4444" font-size="11" font-weight="600" text-anchor="middle">5. Lookup Nonce(N_1092)</text>

  <!-- Cache HIT -> REJECT -->
  <line x1="620" y1="410" x2="390" y2="410" stroke="#FF4444" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="390,406 380,410 390,414" fill="#FF4444"/>
  <text x="500" y="404" fill="#FF4444" font-size="11" font-weight="700" text-anchor="middle">Cache HIT -> ERR_NONCE_REPLAYED</text>

  <!-- Rejection to Client -->
  <line x1="380" y1="435" x2="150" y2="435" stroke="#FF4444" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="150,431 140,435 150,439" fill="#FF4444"/>
  <text x="255" y="430" fill="#FF4444" font-size="11" font-weight="700" text-anchor="middle">HTTP 409 Conflict Rejection</text>
</svg>
