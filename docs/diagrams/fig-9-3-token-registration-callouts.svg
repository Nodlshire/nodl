<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #0E0E10; font-family: 'Inter', system-ui, sans-serif;">
  <!-- Header Banner -->
  <rect x="20" y="20" width="920" height="50" rx="8" fill="#141419" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="40" y="50" fill="#00FFB2" font-size="16" font-weight="700" letter-spacing="0.5">FIG 9.3 – NODLR PORTAL TOKEN REGISTRATION &amp; INVITER PAIRING</text>
  <text x="730" y="50" fill="#22D3EE" font-size="12" font-weight="500">v1.5.0-enterprise | Nodlr Portal</text>

  <!-- Simulated Browser Window -->
  <rect x="40" y="90" width="880" height="360" rx="8" fill="#141419" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="40" y="90" width="880" height="30" rx="8" fill="#1A1A22"/>
  <text x="480" y="110" fill="#A0A0AB" font-size="11" text-anchor="middle" font-family="monospace">https://nodlr.wnode.one/dashboard/hardware</text>

  <!-- Registration Panel UI -->
  <rect x="200" y="140" width="560" height="280" rx="8" fill="#0D0D12" stroke="#00FFB2" stroke-width="1.5"/>
  <text x="230" y="175" fill="#FFFFFF" font-size="15" font-weight="700">Pair Machine WUID Token</text>
  <text x="230" y="195" fill="#A0A0AB" font-size="11">Enter the machine registration token generated during nodld runner installation.</text>

  <!-- Input Field 1: Token -->
  <text x="230" y="230" fill="#00FFB2" font-size="11" font-weight="600">MACHINE TOKEN</text>
  <rect x="230" y="240" width="500" height="36" rx="6" fill="#1A1A22" stroke="rgba(0,255,178,0.4)" stroke-width="1"/>
  <text x="245" y="263" fill="#FFFFFF" font-size="12" font-family="monospace">WUID-TOKEN-8F92A110BC94</text>

  <!-- Input Field 2: Inviter WUID -->
  <text x="230" y="300" fill="#22D3EE" font-size="11" font-weight="600">INVITER WUID (AUTO-FILLED OR ROUND-ROBIN)</text>
  <rect x="230" y="310" width="500" height="36" rx="6" fill="#1A1A22" stroke="rgba(34,211,238,0.4)" stroke-width="1"/>
  <text x="245" y="333" fill="#00FFB2" font-size="12" font-family="monospace">WUID-FOUNDER-NODE-001 (Locked &amp; Verified)</text>

  <!-- Submit Button -->
  <rect x="230" y="365" width="500" height="36" rx="6" fill="#00FFB2"/>
  <text x="480" y="388" fill="#0E0E10" font-size="13" font-weight="700" text-anchor="middle">REGISTER MACHINE TO SOT CORE</text>

  <!-- Callout Pins -->
  <circle cx="745" cy="258" r="14" fill="#00FFB2"/>
  <text x="745" y="263" fill="#0E0E10" font-size="12" font-weight="800" text-anchor="middle">1</text>

  <circle cx="745" cy="328" r="14" fill="#22D3EE"/>
  <text x="745" y="333" fill="#0E0E10" font-size="12" font-weight="800" text-anchor="middle">2</text>
</svg>
