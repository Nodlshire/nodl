[package]
name = "nodl_operator_desktop_lib"
version = "0.1.0"
description = "NODL Node Operator Desktop Tray GUI"
authors = ["Wnode Team <dev@wnode.one>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
